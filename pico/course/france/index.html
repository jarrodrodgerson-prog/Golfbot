<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Golf – Paris Hole</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d4a06; overflow: hidden; font-family: system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #fff; font-size: 14px; text-shadow: 0 1px 2px #000;
         display: flex; gap: 14px; align-items: center; user-select: none; }
  #hud button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #fff8; background: #0006; color: #fff; cursor: pointer; }
  #hud button:hover { background: #000a; }
  #score { position: fixed; top: 14px; right: 16px; left: 16px; display: flex; flex-wrap: wrap; justify-content: flex-end;
           gap: 10px; align-items: stretch; user-select: none; pointer-events: none; }
  #score .pill { background: #fff; border: 3px solid #000; border-radius: 12px; padding: 6px 14px; display: flex; gap: 8px;
                 align-items: baseline; font-weight: 800; font-size: 26px; box-shadow: 0 3px 0 #000; }
  #score .lbl { font-size: 14px; letter-spacing: .08em; color: #555; }
  #score button { font: 800 20px system-ui, sans-serif; color: #fff; border: 3px solid #000; border-radius: 12px;
              padding: 6px 16px; cursor: pointer; box-shadow: 0 3px 0 #000; pointer-events: auto; }
  #resetBtn { background: #d22f27; }
  #resetBtn:hover { background: #ea5a47; }
  #previousHoleBtn, #nextHoleBtn { background: #175c30; }
  #previousHoleBtn:hover, #nextHoleBtn:hover { background: #227b42; }
  #score button:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="score">
  <div class="pill" role="status"><span class="lbl">HOLE</span><span id="holeNumber">1</span></div>
  <div class="pill"><span class="lbl">SHOTS</span><span id="strokes">0</span></div>
  <div class="pill"><span class="lbl">PAR</span><span>2</span></div>
  <button id="resetBtn" title="Reset ball (R)">&#x21bb; Reset</button>
  <button id="previousHoleBtn" type="button">Previous hole</button>
  <button id="nextHoleBtn" type="button">Next hole</button>
</div>
<div id="hud">
  <button id="mouseBtn" title="Toggle mouse aiming (M)">Mouse: on</button>
  <button id="debugBtn" title="Show collision mask (D)">Debug</button>
</div>

//////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////";                                   // 1 bit per cell, 1 = solid

const mask = (() => {
  const bin = atob(MASK_B64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const m = new Uint8Array(MASK_W * MASK_H);
  for (let i = 0; i < m.length; i++) m[i] = (bytes[i >> 3] >> (7 - (i & 7))) & 1;
  return m;
})();

function distanceToSegment(x, y, start, end) {
  const dx = end.x - start.x, dy = end.y - start.y;
  const projection = ((x - start.x) * dx + (y - start.y) * dy) / (dx * dx + dy * dy);
  const t = Math.max(0, Math.min(1, projection));
  return Math.hypot(x - start.x - t * dx, y - start.y - t * dy);
}

function solidAt(x, y) {
  const { tee, bend, cup, fairwayRadius } = HOLES[holeIndex];
  if (bend) {
    return distanceToSegment(x, y, tee, bend) > fairwayRadius &&
      distanceToSegment(x, y, bend, cup) > fairwayRadius;
  }
  const mx = Math.floor(x / MASK_SCALE), my = Math.floor(y / MASK_SCALE);
  if (mx < 0 || my < 0 || mx >= MASK_W || my >= MASK_H) return true;
  return mask[my * MASK_W + mx] === 1;
}

/* =====================================================================
   Game state
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const board = new Image(); board.src = BOARD_SRC;

const ball = { x: CONFIG.START.x, y: CONFIG.START.y, vx: 0, vy: 0, moving: false, sunk: false, sinkT: 0 };
let strokes = 0, debug = false, aim = null, banner = null, holeIndex = 0;
const listeners = {};

function emit(type, detail) {
  (listeners[type] || []).forEach(fn => fn(detail));
  window.dispatchEvent(new CustomEvent('minigolf:' + type, { detail }));
}

/* =====================================================================
   Physics
   ===================================================================== */
const SAMPLES = 32;
const ring = Array.from({ length: SAMPLES }, (_, i) => {
  const a = (i / SAMPLES) * Math.PI * 2; return [Math.cos(a), Math.sin(a)];
});

// Returns outward normal if the ball overlaps something solid, else null.
function contactNormal(x, y) {
  let nx = 0, ny = 0, hit = false;
  for (const r of [CONFIG.BALL_R, CONFIG.BALL_R * 0.6]) {
    for (const [cx, cy] of ring) {
      if (solidAt(x + cx * r, y + cy * r)) { nx -= cx; ny -= cy; hit = true; }
    }
  }
  if (!hit) return null;
  const len = Math.hypot(nx, ny);
  return len < 1e-6 ? { x: 0, y: 0 } : { x: nx / len, y: ny / len };
}

function step(dt) {
  if (!ball.moving || ball.sunk) return;
  const H = CONFIG.HOLE;
  let speed = Math.hypot(ball.vx, ball.vy);

  // Over the cup: drop if slow enough, otherwise curve toward the centre (lip-out).
  const dHole = Math.hypot(ball.x - H.x, ball.y - H.y);
  if (dHole < H.r + CONFIG.CAPTURE_EXTRA) {
    if (speed <= CONFIG.SINK_SPEED) return sink();   // ball centre is over the cup and slow enough
    const ux = (H.x - ball.x) / (dHole || 1), uy = (H.y - ball.y) / (dHole || 1);
    ball.vx += ux * CONFIG.CUP_PULL * dt; ball.vy += uy * CONFIG.CUP_PULL * dt;
  }

  // Gentle funnel around the cup so near-misses curl in (keeps hole-in-one very doable)
  let f = 0;
  if (dHole >= H.r && dHole < CONFIG.FUNNEL_R) {
    f = CONFIG.FUNNEL_PULL * (1 - (dHole - H.r) / (CONFIG.FUNNEL_R - H.r));
    ball.vx += (H.x - ball.x) / dHole * f * dt; ball.vy += (H.y - ball.y) / dHole * f * dt;
  }

  // Rolling friction
  speed = Math.hypot(ball.vx, ball.vy);
  const newSpeed = Math.max(0, speed - (CONFIG.ROLL_DECEL + CONFIG.DRAG * speed) * dt);
  if (newSpeed < CONFIG.STOP_SPEED && dHole >= H.r && f <= CONFIG.ROLL_DECEL) {   // rests unless the funnel is steep enough to roll it in
    ball.vx = ball.vy = 0; ball.moving = false;
    emit('stop', { x: ball.x, y: ball.y, strokes });
    return;
  }
  const k = speed > 0 ? newSpeed / speed : 0;
  ball.vx *= k; ball.vy *= k;

  // Move in sub-steps of <= 1.5px so we never tunnel through thin outlines.
  const dist = newSpeed * dt, n = Math.max(1, Math.ceil(dist / 1.5));
  for (let i = 0; i < n; i++) {
    ball.x += ball.vx * dt / n; ball.y += ball.vy * dt / n;
    const nrm = contactNormal(ball.x, ball.y);
    if (!nrm) continue;
    // push out of the obstacle
    for (let j = 0; j < 30 && contactNormal(ball.x, ball.y); j++) { ball.x += nrm.x * 0.5; ball.y += nrm.y * 0.5; }
    const vn = ball.vx * nrm.x + ball.vy * nrm.y;
    if (vn < 0) {
      const tx = ball.vx - vn * nrm.x, ty = ball.vy - vn * nrm.y;
      ball.vx = tx * CONFIG.WALL_TANGENT_KEEP - vn * nrm.x * CONFIG.WALL_RESTITUTION;
      ball.vy = ty * CONFIG.WALL_TANGENT_KEEP - vn * nrm.y * CONFIG.WALL_RESTITUTION;
      emit('wallHit', { x: ball.x, y: ball.y, impactSpeed: -vn });
    }
  }
}

function sink() {
  ball.sunk = true; ball.moving = false; ball.sinkT = 0; ball.dropX = ball.x; ball.dropY = ball.y;
  ball.vx = ball.vy = 0;
  const diff = strokes - CONFIG.PAR;
  const names = { '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par', '1': 'Bogey', '2': 'Double Bogey' };
  banner = strokes === 1
    ? { text: 'Trou en un !', sub: 'Hole in one!', gold: true, t: 0 }
    : { text: names[diff] || `+${diff}`, sub: `${strokes} shots`, gold: false, t: 0 };
  if (strokes === 1) fireworksUntil = performance.now() + 7000;
  emit('sunk', { strokes, holeInOne: strokes === 1 });
}

/* =====================================================================
   Public API – used by mouse controls AND the putter sim
   ===================================================================== */
/**
 * Hit the ball.
 * @param {number} speed  launch speed (px/s on the board, times CONFIG.PUTTER_SPEED_SCALE)
 * @param {number} angle  degrees. 0 = right (toward the hole), 90 = up, -90 = down, 180 = left
 */
function shoot(speed, angle) {
  if (ball.sunk) return false;
  if (CONFIG.ONLY_SHOOT_WHEN_STOPPED && ball.moving) return false;
  const v = Math.min(CONFIG.MAX_SPEED, Math.max(0, speed * CONFIG.PUTTER_SPEED_SCALE));
  if (v <= 0) return false;
  const a = angle * Math.PI / 180;
  ball.vx = Math.cos(a) * v; ball.vy = -Math.sin(a) * v; ball.moving = true;
  strokes++; updateHud();
  emit('shot', { speed: v, angle, strokes });
  return true;
}

function reset() {
  Object.assign(ball, { x: CONFIG.START.x, y: CONFIG.START.y, vx: 0, vy: 0, moving: false, sunk: false, sinkT: 0 });
  strokes = 0; aim = null; banner = null; particles.length = 0; fireworksUntil = 0; updateHud(); emit('reset', {});
}

function changeHole(step) {
  holeIndex = (holeIndex + step + HOLES.length) % HOLES.length;
  CONFIG.START = HOLES[holeIndex].tee;
  CONFIG.HOLE = HOLES[holeIndex].cup;
  document.getElementById('holeNumber').textContent = holeIndex + 1;
  reset();
}

function setMouseEnabled(on) { CONFIG.MOUSE_ENABLED = !!on; aim = null; updateHud(); }

/** Distance a shot of `speed` (board px/s) rolls on open ground before stopping. */
function rollDistance(speed) {
  let v = speed, d = 0; const dt = 1 / 240;
  while (v > CONFIG.STOP_SPEED) { const nv = Math.max(0, v - (CONFIG.ROLL_DECEL + CONFIG.DRAG * v) * dt); d += nv * dt; v = nv; }
  return d;
}
/** Board speed that rolls `distance` px on open ground (binary search). */
function speedForDistance(distance) {
  let lo = 0, hi = CONFIG.MAX_SPEED;
  for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; rollDistance(mid) < distance ? lo = mid : hi = mid; }
  return (lo + hi) / 2;
}
/** Aim for the bend until the ball has a clear route to the cup. */
function idealShot() {
  const { bend, cup, fairwayRadius } = HOLES[holeIndex];
  const needsTurn = bend &&
    distanceToSegment(ball.x, ball.y, bend, cup) > fairwayRadius - CONFIG.BALL_R;
  const target = needsTurn ? bend : cup;
  const dx = target.x - ball.x, dy = target.y - ball.y;
  const distance = Math.hypot(dx, dy) + (needsTurn ? 0 : cup.r * 0.35);
  return { speed: speedForDistance(distance), angle: Math.atan2(-dy, dx) * 180 / Math.PI };
}

window.MiniGolf = {
  shoot, reset, setMouseEnabled, rollDistance, speedForDistance, idealShot, CONFIG,
  on(type, fn) { (listeners[type] ||= []).push(fn); },
  get state() { return { ...ball, strokes, mouseEnabled: CONFIG.MOUSE_ENABLED }; },
};

/* =====================================================================
   Mouse / touch controls (drag back from the ball, release to putt)
   ===================================================================== */
let view = { s: 1, ox: 0, oy: 0 };
function toBoard(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / view.s, y: (e.clientY - r.top) / view.s };
}
canvas.addEventListener('pointerdown', e => {
  if (!CONFIG.MOUSE_ENABLED || ball.sunk || (CONFIG.ONLY_SHOOT_WHEN_STOPPED && ball.moving)) return;
  canvas.setPointerCapture(e.pointerId); aim = toBoard(e);
});
canvas.addEventListener('pointermove', e => { if (aim) aim = toBoard(e); });
canvas.addEventListener('pointerup', () => {
  if (!aim) return;
  const p = aimParams(); aim = null;
  if (p.speed > 20) shoot(p.speed, p.angle);
});
canvas.addEventListener('pointercancel', () => aim = null);

function aimParams() {
  const dx = ball.x - aim.x, dy = ball.y - aim.y;           // pull back = shoot opposite
  const speed = Math.min(CONFIG.MAX_SPEED, Math.hypot(dx, dy) * CONFIG.MOUSE_POWER);
  return { speed, angle: Math.atan2(-dy, dx) * 180 / Math.PI, dx, dy };
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'm') setMouseEnabled(!CONFIG.MOUSE_ENABLED);
  if (k === 'r') reset();
  if (k === 'd') debug = !debug;
});
document.getElementById('mouseBtn').onclick = () => setMouseEnabled(!CONFIG.MOUSE_ENABLED);
document.getElementById('resetBtn').onclick = reset;
document.getElementById('previousHoleBtn').onclick = () => changeHole(-1);
document.getElementById('nextHoleBtn').onclick = () => changeHole(1);
document.getElementById('debugBtn').onclick = () => debug = !debug;
function updateHud() {
  document.getElementById('strokes').textContent = strokes;
  document.getElementById('mouseBtn').textContent = `Mouse: ${CONFIG.MOUSE_ENABLED ? 'on' : 'off'}`;
  canvas.style.cursor = CONFIG.MOUSE_ENABLED ? 'crosshair' : 'default';
}

/* =====================================================================
   Rendering
   ===================================================================== */
let maskCanvas = null;
function buildMaskCanvas() {
  maskCanvas = document.createElement('canvas'); maskCanvas.width = MASK_W; maskCanvas.height = MASK_H;
  const mctx = maskCanvas.getContext('2d'), img = mctx.createImageData(MASK_W, MASK_H);
  for (let i = 0; i < mask.length; i++) if (mask[i]) { img.data[i*4] = 255; img.data[i*4+3] = 110; }
  mctx.putImageData(img, 0, 0);
}

function resize() {
  const dpr = devicePixelRatio || 1;
  const s = Math.min(innerWidth / CONFIG.BOARD_W, innerHeight / CONFIG.BOARD_H);
  view.s = s;
  canvas.style.width = CONFIG.BOARD_W * s + 'px'; canvas.style.height = CONFIG.BOARD_H * s + 'px';
  canvas.width = Math.round(CONFIG.BOARD_W * s * dpr); canvas.height = Math.round(CONFIG.BOARD_H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', resize);

function drawDogleg({ tee, bend, cup, fairwayRadius }) {
  const lawn = ctx.createLinearGradient(0, 0, 0, CONFIG.BOARD_H);
  lawn.addColorStop(0, '#183e38');
  lawn.addColorStop(1, '#0d2729');
  ctx.fillStyle = lawn;
  ctx.fillRect(0, 0, CONFIG.BOARD_W, CONFIG.BOARD_H);

  // The tricolor and tower frame the putting lane.
  for (const [index, color] of ['#3158a3', '#fff1d7', '#bd383e'].entries()) {
    ctx.fillStyle = color;
    ctx.fillRect(126 + index * 38, 132, 38, 54);
  }
  ctx.fillStyle = '#fff1d7';
  ctx.font = '700 56px Georgia, serif';
  ctx.fillText('Le virage de Paris', 126, 260);

  ctx.save();
  ctx.translate(1500, 846);
  ctx.strokeStyle = '#c5aa73';
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-124, 0);
  ctx.quadraticCurveTo(-52, -105, -17, -305);
  ctx.lineTo(17, -305);
  ctx.quadraticCurveTo(52, -105, 124, 0);
  ctx.moveTo(-79, 0);
  ctx.quadraticCurveTo(0, -163, 79, 0);
  ctx.moveTo(-87, -85); ctx.lineTo(87, -85);
  ctx.moveTo(-56, -173); ctx.lineTo(56, -173);
  ctx.moveTo(0, -305); ctx.lineTo(0, -338);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(tee.x, tee.y);
  ctx.lineTo(bend.x, bend.y);
  ctx.lineTo(cup.x, cup.y);
  ctx.lineWidth = fairwayRadius * 2 + 18;
  ctx.strokeStyle = debug ? '#e6584c' : '#dfca9b';
  ctx.stroke();
  ctx.lineWidth = fairwayRadius * 2;
  ctx.strokeStyle = '#548449';
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#14271d';
  ctx.beginPath();
  ctx.arc(cup.x, cup.y, cup.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff1d7';
  ctx.fillRect(cup.x + 10, cup.y - 88, 4, 88);
  ctx.fillStyle = '#bd383e';
  ctx.beginPath();
  ctx.moveTo(cup.x + 14, cup.y - 88);
  ctx.lineTo(cup.x + 59, cup.y - 72);
  ctx.lineTo(cup.x + 14, cup.y - 56);
  ctx.fill();
}

function draw() {
  ctx.clearRect(0, 0, CONFIG.BOARD_W, CONFIG.BOARD_H);
  const hole = HOLES[holeIndex];
  if (hole.bend) drawDogleg(hole);
  else if (board.complete) ctx.drawImage(board, 0, 0, CONFIG.BOARD_W, CONFIG.BOARD_H);
  if (debug && !hole.bend) {
    if (!maskCanvas) buildMaskCanvas();
    ctx.imageSmoothingEnabled = false; ctx.drawImage(maskCanvas, 0, 0, CONFIG.BOARD_W, CONFIG.BOARD_H); ctx.imageSmoothingEnabled = true;
    const H = CONFIG.HOLE; ctx.strokeStyle = '#ff0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(H.x, H.y, H.r, 0, Math.PI * 2); ctx.stroke();
  }

  // aim guide
  if (aim && CONFIG.MOUSE_ENABLED) {
    const p = aimParams(), a = p.angle * Math.PI / 180, frac = p.speed / CONFIG.MAX_SPEED;
    const len = 60 + frac * 340;
    ctx.save(); ctx.setLineDash([10, 10]); ctx.lineWidth = 4; ctx.strokeStyle = '#fffd';
    ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + Math.cos(a) * len, ball.y - Math.sin(a) * len); ctx.stroke();
    ctx.restore();
    // power bar
    ctx.fillStyle = '#0008'; ctx.fillRect(ball.x - 50, ball.y + 26, 100, 12);
    ctx.fillStyle = `hsl(${120 - frac * 120},90%,50%)`; ctx.fillRect(ball.x - 50, ball.y + 26, 100 * frac, 12);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(ball.x - 50, ball.y + 26, 100, 12);
  }

  // ball
  let r = CONFIG.BALL_R, bx = ball.x, by = ball.y;
  let inCup = false;
  if (ball.sunk) {   // roll to the centre of the cup and settle there (stays visible)
    const t = Math.min(1, ball.sinkT / 0.25), e = 1 - (1 - t) * (1 - t);
    bx = ball.dropX + (CONFIG.HOLE.x - ball.dropX) * e; by = ball.dropY + (CONFIG.HOLE.y - ball.dropY) * e;
    r *= 1 - 0.2 * e; inCup = t >= 1;
  }
  if (inCup) {
    ctx.fillStyle = '#e8e8e8'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(bx, by + 3, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0004'; ctx.beginPath(); ctx.arc(bx, by + 3, r, Math.PI * 0.1, Math.PI * 0.9); ctx.fill();
  } else {
    ctx.fillStyle = '#0005'; ctx.beginPath(); ctx.ellipse(bx + 3, by + 4, r, r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ddd'; ctx.beginPath(); ctx.arc(bx + r * 0.3, by + r * 0.3, r * 0.45, 0, Math.PI * 2); ctx.fill();
  }

  drawParticles();
  if (banner) drawBanner();
}

/* =====================================================================
   Fireworks + banner
   ===================================================================== */
const particles = []; let fireworksUntil = 0, nextRocket = 0;
const FW_COLORS = ['#ffd700', '#fff3a0', '#ffb300', '#1e50a0', '#ffffff', '#d22f27'];
function burst(x, y) {
  const base = FW_COLORS[Math.floor(Math.random() * FW_COLORS.length)], n = 90;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 150 + Math.random() * 420;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1.2 + Math.random() * 0.8, age: 0,
                     color: Math.random() < 0.7 ? base : '#ffd700', size: 2.5 + Math.random() * 3, spark: false });
  }
}
function launchRocket() {
  const x = 300 + Math.random() * 1320, ty = 120 + Math.random() * 380;
  particles.push({ x, y: 1080, vx: (Math.random() - 0.5) * 120, vy: -Math.sqrt(2 * 600 * (1080 - ty)), life: 9, age: 0,
                   color: '#fff6c0', size: 4, rocket: true });
}
function updateParticles(dt, now) {
  if (now < fireworksUntil && now >= nextRocket) { launchRocket(); if (Math.random() < 0.5) launchRocket(); nextRocket = now + 280 + Math.random() * 320; }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.age += dt;
    if (p.rocket) {
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (Math.random() < 0.7) particles.push({ x: p.x, y: p.y, vx: (Math.random()-0.5)*40, vy: 40, life: 0.4, age: 0, color: '#ffcc66', size: 2 });
      if (p.vy >= 0) { burst(p.x, p.y); particles.splice(i, 1); }
      continue;
    }
    p.vx *= 1 - 1.6 * dt; p.vy = p.vy * (1 - 1.6 * dt) + 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.age >= p.life) particles.splice(i, 1);
  }
}
function drawParticles() {
  if (!particles.length) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    const a = p.rocket ? 1 : Math.max(0, 1 - p.age / p.life);
    ctx.globalAlpha = a * (0.75 + 0.25 * Math.sin(p.age * 40));   // twinkle
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.rocket ? 1 : 0.5 + a * 0.5), 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function drawBanner() {
  const t = banner.t, cx = 960, cy = 400;
  const pop = Math.min(1, t / 0.35), scale = (pop < 1 ? 0.3 + 0.9 * Math.sin(pop * Math.PI / 2) * (1 + 0.15 * (1 - pop)) : 1);
  ctx.save(); ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (banner.gold) {
    const flash = 0.5 + 0.5 * Math.sin(t * 9);                     // flashing glow
    ctx.font = '900 150px Georgia, "Times New Roman", serif';
    const g = ctx.createLinearGradient(0, -80, 0, 80);
    g.addColorStop(0, '#fff7c2'); g.addColorStop(0.35, '#ffd700'); g.addColorStop(0.55, '#d4a017');
    g.addColorStop(0.75, '#ffe680'); g.addColorStop(1, '#a8740a');
    ctx.lineJoin = 'round';
    ctx.shadowColor = `rgba(255, 215, 0, ${0.5 + 0.5 * flash})`; ctx.shadowBlur = 25 + 45 * flash;
    ctx.lineWidth = 18; ctx.strokeStyle = '#3a2500'; ctx.strokeText(banner.text, 0, 0);
    ctx.shadowBlur = 0; ctx.fillStyle = g; ctx.fillText(banner.text, 0, 0);
    // moving shine sweep across the letters
    ctx.globalCompositeOperation = 'source-atop';
    const sx = ((t * 700) % 1800) - 900, sh = ctx.createLinearGradient(sx - 120, 0, sx + 120, 0);
    sh.addColorStop(0, 'rgba(255,255,255,0)'); sh.addColorStop(0.5, `rgba(255,255,255,${0.55 + 0.3 * flash})`); sh.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sh; ctx.fillText(banner.text, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.font = 'italic 700 46px Georgia, serif'; ctx.lineWidth = 8; ctx.strokeStyle = '#3a2500'; ctx.fillStyle = '#ffe680';
    ctx.strokeText(banner.sub, 0, 110); ctx.fillText(banner.sub, 0, 110);
  } else {
    ctx.font = '900 120px system-ui, sans-serif'; ctx.lineJoin = 'round';
    ctx.lineWidth = 14; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff'; ctx.strokeText(banner.text, 0, 0); ctx.fillText(banner.text, 0, 0);
    ctx.font = '800 44px system-ui, sans-serif'; ctx.lineWidth = 8; ctx.strokeText(banner.sub, 0, 100); ctx.fillText(banner.sub, 0, 100);
  }
  ctx.font = '700 30px system-ui, sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = '#000'; ctx.fillStyle = '#fff';
  ctx.strokeText('Press Reset (or R) to play again', 0, banner.gold ? 175 : 165); ctx.fillText('Press Reset (or R) to play again', 0, banner.gold ? 175 : 165);
  ctx.restore();
}

/* =====================================================================
   Loop (fixed 240 Hz physics)
   ===================================================================== */
const DT = 1 / 240; let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= DT) { step(DT); if (ball.sunk) ball.sinkT += DT; if (banner) banner.t += DT; updateParticles(DT, now); acc -= DT; }
  draw(); requestAnimationFrame(frame);
}
resize(); updateHud(); requestAnimationFrame(frame);
</script>
</body></html>
